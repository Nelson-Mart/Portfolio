<svg width="256" height="256" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blobGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#AFA9EC"/>
      <stop offset="100%" stop-color="#5DCAA5"/>
    </linearGradient>

    <!-- Same blob outline, reused to clip the wiring so it never spills outside -->
    <clipPath id="blobClip">
      <path d="M50,7 C71,5 92,21 94,46 C96,69 78,94 53,95 C28,96 6,80 5,55 C4,29 26,9 50,7 Z"/>
    </clipPath>
  </defs>

  <!-- Blob base fill -->
  <path
    d="M50,7 C71,5 92,21 94,46 C96,69 78,94 53,95 C28,96 6,80 5,55 C4,29 26,9 50,7 Z"
    fill="url(#blobGrad)"
  />

  <!-- Circuit wiring, masked onto the blob's surface -->
  <g clip-path="url(#blobClip)">
    <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.45">
      <path d="M14,32 L14,48 L27,48 L27,64"/>
      <path d="M86,28 L86,44 L72,44 L72,58"/>
      <path d="M50,10 L50,24 L36,24"/>
      <path d="M50,92 L50,78 L64,78"/>
      <path d="M10,58 L23,58 L23,70"/>
      <path d="M90,62 L79,62 L79,50"/>
      <path d="M38,88 L38,74 L30,74"/>
    </g>
    <g fill="#ffffff" opacity="0.65">
      <circle cx="14" cy="32" r="2.1"/>
      <circle cx="27" cy="64" r="2.1"/>
      <circle cx="86" cy="28" r="2.1"/>
      <circle cx="72" cy="58" r="2.1"/>
      <circle cx="50" cy="10" r="2.1"/>
      <circle cx="36" cy="24" r="2.1"/>
      <circle cx="50" cy="92" r="2.1"/>
      <circle cx="64" cy="78" r="2.1"/>
      <circle cx="10" cy="58" r="2.1"/>
      <circle cx="23" cy="70" r="2.1"/>
      <circle cx="90" cy="62" r="2.1"/>
      <circle cx="79" cy="50" r="2.1"/>
      <circle cx="38" cy="88" r="2.1"/>
      <circle cx="30" cy="74" r="2.1"/>
    </g>
  </g>

  <!-- N monogram -->
  <text
    x="50" y="68"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800"
    font-size="58"
    fill="#0d0d12"
    fill-opacity="0.92"
  >N</text>
</svg>
